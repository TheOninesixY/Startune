<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startune</title>
    <!-- Google Fonts & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='100' height='100'%3E%3Cpath fill='%234285F4' d='M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5 5.5-2.5-5.5-2.5zm7.5 5.5l-1.25 2.75L15 19l2.75 1.25L19 22l1.25-2.75L23 19l-2.75-1.25L19 15z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 全屏同色遮罩块 -->
    <div id="app-cover"></div>

    <!-- Header Navigation -->
    <header>
        <div class="header-brand">
            <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">auto_awesome</span>
            <span>Startune</span>
        </div>
        <div class="header-actions">
            <!-- Settings Modal Button -->
            <button class="icon-btn" id="settingsBtn" data-i18n-title="settingsBtnTitle" title="设置">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Time & Greeting -->
        <div class="time-greeting-container">
            <div class="digital-clock" id="clock">12:00</div>
            <div class="date-display" id="date">2026年8月8日 星期六</div>
            <div class="greeting-badge">
                <span class="material-symbols-rounded" style="font-size: 18px;">wb_sunny</span>
                <span id="greetingText">早上好，愿今天充满精彩！</span>
            </div>
        </div>

        <!-- Material You Search Bar -->
        <div class="search-container">
            <form id="searchForm" target="_blank" action="https://www.google.com/search">
                <div class="search-bar">
                    <div class="engine-selector" id="engineSelector">
                        <span id="engineName">Google</span>
                        <span class="material-symbols-rounded" style="font-size: 18px;">arrow_drop_down</span>
                    </div>
                    <input type="text" name="q" class="search-input" id="searchInput" data-i18n-placeholder="searchInputPlaceholder" placeholder="搜索网络或输入网址..." autocomplete="off" autofocus>
                    <div class="search-actions">
                        <button type="submit" class="search-btn" id="searchSubmitBtn" data-i18n-title="searchBtnTitle" title="开始搜索">
                            <span class="material-symbols-rounded">search</span>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Search Engine Dropdown -->
            <div class="engine-menu" id="engineMenu">
                <div class="engine-item" data-engine="google" data-action="https://www.google.com/search" data-name="q">Google</div>
                <div class="engine-item" data-engine="baidu" data-action="https://www.baidu.com/s" data-name="wd" data-i18n-text="engineBaidu">百度</div>
                <div class="engine-item" data-engine="bing" data-action="https://www.bing.com/search" data-name="q">Bing</div>
                <div class="engine-item" data-engine="duckduckgo" data-action="https://duckduckgo.com/" data-name="q">DuckDuckGo</div>
                <div class="engine-item" data-engine="bilibili" data-action="https://search.bilibili.com/all" data-name="keyword" data-i18n-text="engineBilibili">哔哩哔哩</div>
                <div class="engine-item" data-engine="github" data-action="https://github.com/search" data-name="q">GitHub</div>
            </div>
        </div>

        <!-- Shortcuts Grid -->
        <div class="shortcuts-grid" id="shortcutsContainer">
            <!-- Rendered by JavaScript -->
        </div>
    </main>

    <!-- Context Menu for Shortcuts -->
    <div class="context-menu" id="shortcutContextMenu">
        <div class="context-menu-item" id="ctxEdit">
            <span class="material-symbols-rounded" style="font-size: 18px;">edit</span>
            <span data-i18n-text="ctxEdit">修改</span>
        </div>
        <div class="context-menu-item danger" id="ctxDelete">
            <span class="material-symbols-rounded" style="font-size: 18px;">delete</span>
            <span data-i18n-text="ctxDelete">删除</span>
        </div>
    </div>

    <!-- Footer Links -->
    <footer class="footer-container">
        <a href="https://github.com/TheOninesixY" target="_blank" class="footer-link">OninesixY</a>
        <a href="https://github.com/TheOninesixY/Startune" target="_blank" class="footer-link">GitHub</a>
        <span class="footer-link" id="copyLinkBtn">stune.onsy.qzz.io</span>
    </footer>

    <!-- Toast Notification -->
    <div class="toast" id="toast">已复制</div>

    <!-- Add/Edit Shortcut Modal -->
    <div class="modal-overlay" id="shortcutModal">
        <div class="modal-card">
            <div class="modal-title" id="shortcutModalTitle">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">add_link</span>
                <span id="shortcutModalTitleText">添加快捷方式</span>
            </div>
            <div class="form-group">
                <label for="siteName" data-i18n-text="labelShortcutName">名称</label>
                <input type="text" id="siteName" class="form-input" data-i18n-placeholder="placeholderShortcutName" placeholder="例如：GitHub">
            </div>
            <div class="form-group">
                <label for="siteUrl" data-i18n-text="labelShortcutUrl">网址 (URL)</label>
                <input type="url" id="siteUrl" class="form-input" placeholder="https://example.com">
            </div>
            <div class="modal-actions">
                <button class="btn btn-text" id="cancelShortcutBtn" data-i18n-text="btnCancel">取消</button>
                <button class="btn btn-filled" id="saveShortcutBtn" data-i18n-text="btnSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Personalization & Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-title">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">settings</span>
                <span data-i18n-text="settingsTitle">设置</span>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelLanguage">语言 (Language)</label>
                <div class="lang-options">
                    <button class="lang-chip" data-lang-val="zh">
                        <span class="material-symbols-rounded">translate</span>
                        <span>简体中文</span>
                    </button>
                    <button class="lang-chip" data-lang-val="en">
                        <span class="material-symbols-rounded">language</span>
                        <span>English</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelTheme">外观模式</label>
                <div class="theme-options">
                    <button class="theme-chip" data-theme-val="system">
                        <span class="material-symbols-rounded">desktop_windows</span>
                        <span data-i18n-text="themeSystem">跟随系统</span>
                    </button>
                    <button class="theme-chip" data-theme-val="light">
                        <span class="material-symbols-rounded">light_mode</span>
                        <span data-i18n-text="themeLight">浅色</span>
                    </button>
                    <button class="theme-chip" data-theme-val="dark">
                        <span class="material-symbols-rounded">dark_mode</span>
                        <span data-i18n-text="themeDark">深色</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelDefaultEngine">默认搜索引擎</label>
                <div class="engine-options">
                    <button class="engine-chip" data-engine-val="google">
                        <span>Google</span>
                    </button>
                    <button class="engine-chip" data-engine-val="baidu">
                        <span data-i18n-text="engineBaidu">百度</span>
                    </button>
                    <button class="engine-chip" data-engine-val="bing">
                        <span>Bing</span>
                    </button>
                    <button class="engine-chip" data-engine-val="duckduckgo">
                        <span>DuckDuckGo</span>
                    </button>
                    <button class="engine-chip" data-engine-val="bilibili">
                        <span data-i18n-text="engineBilibili">哔哩哔哩</span>
                    </button>
                    <button class="engine-chip" data-engine-val="github">
                        <span>GitHub</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelSearchTarget">搜索跳转目标</label>
                <div class="theme-options">
                    <button class="target-chip" data-target-type="search" data-target-val="_blank">
                        <span class="material-symbols-rounded">open_in_new</span>
                        <span data-i18n-text="targetNewTab">新标签页</span>
                    </button>
                    <button class="target-chip" data-target-type="search" data-target-val="_self">
                        <span class="material-symbols-rounded">open_in_browser</span>
                        <span data-i18n-text="targetCurrentTab">当前标签页</span>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelShortcutTarget">快捷方式跳转目标</label>
                <div class="theme-options">
                    <button class="target-chip" data-target-type="shortcut" data-target-val="_blank">
                        <span class="material-symbols-rounded">open_in_new</span>
                        <span data-i18n-text="targetNewTab">新标签页</span>
                    </button>
                    <button class="target-chip" data-target-type="shortcut" data-target-val="_self">
                        <span class="material-symbols-rounded">open_in_browser</span>
                        <span data-i18n-text="targetCurrentTab">当前标签页</span>
                    </button>
                </div>
            </div>
            <div class="form-group row-switch">
                <label for="greetingToggle" data-i18n-text="labelGreeting">显示问候语</label>
                <label class="md-switch">
                    <input type="checkbox" id="greetingToggle" checked>
                    <span class="md-switch-track">
                        <span class="md-switch-thumb"></span>
                    </span>
                </label>
            </div>
            <div class="form-group">
                <label data-i18n-text="labelAccentColor">主题主色 (Accent Seed Color)</label>
                <div class="color-palette-container">
                    <div class="color-palette-options">
                        <div class="color-dot" style="background: #1a73e8;" data-color-val="#1a73e8" data-i18n-title="colorGoogleBlue" title="Google 蓝"></div>
                        <div class="color-dot" style="background: #0f9d58;" data-color-val="#0f9d58" data-i18n-title="colorEmeraldGreen" title="翡翠绿"></div>
                        <div class="color-dot" style="background: #e37400;" data-color-val="#e37400" data-i18n-title="colorCoralOrange" title="珊瑚橙"></div>
                        <div class="color-dot" style="background: #a142f4;" data-color-val="#a142f4" data-i18n-title="colorLavenderPurple" title="薰衣紫"></div>
                    </div>
                    <div class="custom-color-wrapper" data-i18n-title="colorCustomPalette" title="自定义调色盘">
                        <span class="material-symbols-rounded" style="font-size: 20px; color: var(--md-sys-color-on-surface-variant);">colorize</span>
                        <input type="color" id="customColorPicker" class="custom-color-input" value="#1a73e8">
                    </div>
                    <div class="hex-input-wrapper">
                        <span class="hex-input-prefix">#</span>
                        <input type="text" id="hexInput" class="hex-input" placeholder="1A73E8" maxlength="7">
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-filled" id="closeSettingsBtn" data-i18n-text="btnDone">完成</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
