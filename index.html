<!DOCTYPE html>
<html lang="zh-CN" data-theme="system" data-color="google-blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startune</title>
    <!-- Google Fonts & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
    <style>
        :root {
            /* Base Material Shapes & Motion Tokens */
            --md-shape-corner-full: 9999px;
            --md-shape-corner-extra-large: 28px;
            --md-shape-corner-large: 16px;
            --md-shape-corner-medium: 12px;
            --md-shape-corner-small: 8px;

            --transition-fast: 0.15s cubic-bezier(0.2, 0, 0, 1);
            --transition-medium: 0.25s cubic-bezier(0.2, 0, 0, 1);
            --transition-spring: 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        /* ================= COLOR PALETTES (Subtle & Desaturated Material You Tones) ================= */

        /* --- 1. GOOGLE BLUE (Subtle & Soft) --- */
        :root[data-color="google-blue"] {
            --md-sys-color-primary: #1a73e8;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #e8f0fe;
            --md-sys-color-on-primary-container: #174ea6;

            --md-sys-color-surface: #f6f8fc;
            --md-sys-color-surface-container-lowest: #ffffff;

            --md-sys-color-on-surface: #1f2328;

            --md-sys-color-outline: #858d99;
            --md-sys-color-outline-variant: #d8e1ed;
        }

            :root[data-theme="system"][data-color="google-blue"] {
                --md-sys-color-primary: #a8c7fa;
                --md-sys-color-on-primary: #041e49;
                --md-sys-color-primary-container: #08427b;
                --md-sys-color-on-primary-container: #d3e3fd;

        /* --- 3. CORAL ORANGE (Subtle & Soft) --- */

            --md-sys-color-on-surface: #ebe4dd;

        }

        /* --- 4. LAVENDER PURPLE (Subtle & Soft) --- */
        :root[data-color="lavender-purple"] {
            --md-sys-color-primary: #8e24aa;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #f6ebfc;
            --md-sys-color-on-primary-container: #5c1170;

            --md-sys-color-surface: #f8f5fa;
            --md-sys-color-surface-container-lowest: #ffffff;
            --md-sys-color-surface-container-low: #f3edf6;
            --md-sys-color-surface-container: #ebdff0;
            --md-sys-color-surface-container-high: #e2d4e7;
            --md-sys-color-surface-container-highest: #d7c6dd;

            --md-sys-color-on-surface: #221e26;
            --md-sys-color-on-surface-variant: #57505d;
            --md-sys-color-outline: #898190;
            --md-sys-color-outline-variant: #e0d2e5;
        }

        @media (prefers-color-scheme: dark) {
            :root[data-theme="system"][data-color="lavender-purple"] {
                --md-sys-color-primary: #e2b6ff;
                --md-sys-color-on-primary: #4e007d;
                --md-sys-color-primary-container: #6f00af;
                --md-sys-color-on-primary-container: #f3daff;

                --md-sys-color-surface: #161219;
                --md-sys-color-surface-container-lowest: #100d13;
                --md-sys-color-surface-container-low: #1b1720;
                --md-sys-color-surface-container: #201b26;
                --md-sys-color-surface-container-high: #28222f;
                --md-sys-color-surface-container-highest: #312a3a;

                --md-sys-color-on-surface: #e9e2ed;
                --md-sys-color-on-surface-variant: #c9bed0;
                --md-sys-color-outline: #93899a;
                --md-sys-color-outline-variant: #372f3e;
            }
        }

        :root[data-theme="dark"][data-color="lavender-purple"] {
            --md-sys-color-primary: #e2b6ff;
            --md-sys-color-on-primary: #4e007d;
            --md-sys-color-primary-container: #6f00af;

            --md-sys-color-surface: #161219;
            --md-sys-color-surface-container-lowest: #100d13;
            --md-sys-color-surface-container-low: #1b1720;
            --md-sys-color-surface-container: #201b26;
            --md-sys-color-surface-container-high: #28222f;
            --md-sys-color-surface-container-highest: #312a3a;

            --md-sys-color-on-surface: #e9e2ed;
            --md-sys-color-on-surface-variant: #c9bed0;
            --md-sys-color-outline: #93899a;
            --md-sys-color-outline-variant: #372f3e;

        /* ================= GENERAL STYLES ================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Google Sans', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            transition: background-color var(--transition-medium), color var(--transition-medium);
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        /* Header Navigation Bar */
        header {
            width: 100%;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--md-sys-color-on-surface);
            background: var(--md-sys-color-surface-container);
            padding: 8px 18px;
            border-radius: var(--md-shape-corner-full);
            transition: background var(--transition-medium);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--md-shape-corner-full);
            border: none;
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            outline: none;
        }

        .icon-btn:hover {
            background: var(--md-sys-color-surface-container-high);
        }

        .icon-btn:active {
            background: var(--md-sys-color-surface-container-highest);
        }

        /* Main Section Container */
        main {
            width: 100%;
            max-width: 760px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -20px;
        }

        /* Clock & Greeting Card */
        .time-greeting-container {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .digital-clock {
            font-size: 68px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.1;
            color: var(--md-sys-color-on-surface);
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        .date-display {
            font-size: 15px;
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 6px;
            font-weight: 500;
        }

        .greeting-badge {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: var(--md-shape-corner-full);
            font-size: 14px;
            font-weight: 500;
            transition: background-color var(--transition-medium), color var(--transition-medium);
            animation: fadeIn 0.6s ease-out;
        }

        /* Material You Search Bar (Tonal Surface Container) */
        .search-container {
            width: 100%;
            position: relative;
            margin-bottom: 36px;
        }

        .search-bar {
            width: 100%;
            height: 60px;
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-shape-corner-full);
            display: flex;
            align-items: center;
            padding: 0 8px 0 18px;
            transition: all var(--transition-medium);
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .search-bar:focus-within {
            background: var(--md-sys-color-surface-container-lowest);
            border-color: var(--md-sys-color-primary);
        }

        .engine-selector {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 12px;
            border-radius: var(--md-shape-corner-full);
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-right: 10px;
            transition: background var(--transition-fast), color var(--transition-fast);
        }

        .engine-selector:hover {
            background: var(--md-sys-color-surface-container-high);
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-family: inherit;
            font-size: 17px;
            color: var(--md-sys-color-on-surface);
            user-select: text;
            -webkit-user-select: text;
        }

        .search-input::placeholder {
            color: var(--md-sys-color-outline);
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-btn {
            width: 44px;
            height: 44px;
            border-radius: var(--md-shape-corner-full);
            border: none;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity var(--transition-fast), background-color var(--transition-medium);
        }

        .search-btn:hover {
            opacity: 0.9;
        }

        /* Search Engine Dropdown Menu */
        .engine-menu {
            position: absolute;
            top: 68px;
            left: 12px;
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: var(--md-shape-corner-large);
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 100;
            min-width: 140px;
        }

        .engine-menu.active {
            display: flex;
            animation: slideDown 0.15s cubic-bezier(0.2, 0, 0, 1);
        }

        .engine-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: var(--md-shape-corner-medium);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
            transition: background var(--transition-fast);
        }

        .engine-item:hover {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
        }

        /* Shortcuts Section (Subtly Tinted Flat Cards) */
        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .shortcuts-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .shortcut-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: var(--md-shape-corner-extra-large);
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--md-sys-color-on-surface);
            transition: background var(--transition-fast);
            position: relative;
        }

        .shortcut-card:hover {
            background: var(--md-sys-color-surface-container);
        }

        .shortcut-icon-wrapper {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .shortcut-icon-wrapper img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            border-radius: var(--md-shape-corner-medium);
        }

        .shortcut-icon-fallback {
            width: 44px;
            height: 44px;
            border-radius: var(--md-shape-corner-medium);
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .shortcut-title {
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            padding: 0 4px;
        }

        .shortcut-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface-variant);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }

        .shortcut-card:hover .shortcut-delete-btn {
            display: flex;
        }

        .add-shortcut-card {
            border: 2px dashed var(--md-sys-color-outline-variant);
            background: transparent;
            cursor: pointer;
        }

        .add-shortcut-card:hover {
            border-color: var(--md-sys-color-primary);
            background: var(--md-sys-color-surface-container-low);
        }

        /* Footer Empty Spacer */
        footer {
            height: 40px;
        }

        /* Material You Tinted Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(2px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: var(--md-sys-color-surface-container-lowest);
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface);
            width: 90%;
            max-width: 400px;
            border-radius: var(--md-shape-corner-extra-large);
            padding: 28px;
            transform: scale(0.95);
            transition: transform var(--transition-fast), background-color var(--transition-medium);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--md-sys-color-primary);
        }

        .form-input {
            width: 100%;
            height: 48px;
            border-radius: var(--md-shape-corner-medium);
            border: 1px solid var(--md-sys-color-outline-variant);
            background: var(--md-sys-color-surface-container-low);
            color: var(--md-sys-color-on-surface);
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color var(--transition-fast), background var(--transition-fast);
        }

        .form-input:focus {
            background: var(--md-sys-color-surface-container-lowest);
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            height: 40px;
            padding: 0 20px;
            border-radius: var(--md-shape-corner-full);
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-fast);
        }

        .btn-text {
            background: transparent;
            color: var(--md-sys-color-primary);
        }

        .btn-text:hover {
            background: var(--md-sys-color-surface-container);
        }

        .btn-filled {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .btn-filled:hover {
            opacity: 0.9;
        }

        /* Color Theme Options */
        .color-palette-options {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform var(--transition-fast);
        }

        .color-dot:hover {
            transform: scale(1.1);
        }

        .color-dot.active {
            border-color: var(--md-sys-color-on-surface);
        }

        /* Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-brand">
            <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">auto_awesome</span>
            <span>Startune</span>
        </div>
        <div class="header-actions">
            <!-- Dynamic Theme Toggle -->
            <button class="icon-btn" id="themeToggleBtn" title="切换主题模式">
                <span class="material-symbols-rounded" id="themeIcon">dark_mode</span>
            </button>
            <!-- Settings Modal Button -->
            <button class="icon-btn" id="settingsBtn" title="个性化配色">
                <span class="material-symbols-rounded">palette</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Time & Greeting -->
        <div class="time-greeting-container">
            <div class="digital-clock" id="clock">12:00</div>
            <div class="date-display" id="date">2026年8月8日 星期六</div>
            <div class="greeting-badge">
                <span class="material-symbols-rounded" style="font-size: 18px;">wb_sunny</span>
                <span id="greetingText">早上好，愿今天充满精彩！</span>
            </div>
        </div>

        <!-- Material You Search Bar -->
        <div class="search-container">
            <form id="searchForm" target="_blank" action="https://www.google.com/search">
                <div class="search-bar">
                    <div class="engine-selector" id="engineSelector">
                        <span id="engineName">Google</span>
                        <span class="material-symbols-rounded" style="font-size: 18px;">arrow_drop_down</span>
                    </div>
                    <input type="text" name="q" class="search-input" id="searchInput" placeholder="搜索网络或输入网址..." autocomplete="off" autofocus>
                    <div class="search-actions">
                        <button type="submit" class="search-btn" title="开始搜索">
                            <span class="material-symbols-rounded">search</span>
                        </button>
                    </div>
                </div>
            </form>

            <!-- Search Engine Dropdown -->
            <div class="engine-menu" id="engineMenu">
                <div class="engine-item" data-engine="google" data-action="https://www.google.com/search" data-name="q">Google</div>
                <div class="engine-item" data-engine="baidu" data-action="https://www.baidu.com/s" data-name="wd">百度</div>
                <div class="engine-item" data-engine="bing" data-action="https://www.bing.com/search" data-name="q">Bing</div>
                <div class="engine-item" data-engine="bilibili" data-action="https://search.bilibili.com/all" data-name="keyword">哔哩哔哩</div>
                <div class="engine-item" data-engine="github" data-action="https://github.com/search" data-name="q">GitHub</div>
            </div>
        </div>

        <!-- Shortcuts Grid -->
        <div class="shortcuts-grid" id="shortcutsContainer">
            <!-- Rendered by JavaScript -->
        </div>
    </main>

    <!-- Footer Empty Spacer -->
    <footer></footer>

    <!-- Add Shortcut Modal -->
    <div class="modal-overlay" id="shortcutModal">
        <div class="modal-card">
            <div class="modal-title">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">add_link</span>
                添加快捷方式
            </div>
            <div class="form-group">
                <label for="siteName">名称</label>
                <input type="text" id="siteName" class="form-input" placeholder="例如：GitHub">
            </div>
            <div class="form-group">
                <label for="siteUrl">网址 (URL)</label>
                <input type="url" id="siteUrl" class="form-input" placeholder="https://example.com">
            </div>
            <div class="modal-actions">
                <button class="btn btn-text" id="cancelShortcutBtn">取消</button>
                <button class="btn btn-filled" id="saveShortcutBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- Personalization Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-title">
                <span class="material-symbols-rounded" style="color: var(--md-sys-color-primary);">palette</span>
                Material You 主题配色
            </div>
            <div class="form-group">
                <label>选择 Accent 色彩</label>
                <div class="color-palette-options">
                    <div class="color-dot active" style="background: #1a73e8;" data-color-val="google-blue" title="Google 蓝"></div>
                    <div class="color-dot" style="background: #0f9d58;" data-color-val="emerald-green" title="翡翠绿"></div>
                    <div class="color-dot" style="background: #e37400;" data-color-val="coral-orange" title="珊瑚橙"></div>
                    <div class="color-dot" style="background: #a142f4;" data-color-val="lavender-purple" title="薰衣紫"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-filled" id="closeSettingsBtn">完成</button>
            </div>
        </div>
    </div>

    <script>
        // --- Default Shortcuts Data ---
        const defaultShortcuts = [
            { name: 'Google', url: 'https://www.google.com', icon: 'g_mobiledata' },
            { name: 'YouTube', url: 'https://www.youtube.com', icon: 'play_arrow' },
            { name: 'GitHub', url: 'https://github.com', icon: 'code' },
            { name: '哔哩哔哩', url: 'https://www.bilibili.com', icon: 'tv' },
            { name: '知乎', url: 'https://www.zhihu.com', icon: 'quiz' },
            { name: 'V2EX', url: 'https://v2ex.com', icon: 'forum' },
            { name: 'ChatGPT', url: 'https://chatgpt.com', icon: 'smart_toy' }
        ];

        // --- State Management ---
        let shortcuts = JSON.parse(localStorage.getItem('startune_shortcuts')) || defaultShortcuts;
        let currentTheme = localStorage.getItem('startune_theme') || 'system';
        let currentColor = localStorage.getItem('startune_color') || 'google-blue';

        // --- Clock & Greeting Logic ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Date
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);

            // Greeting
            const hour = now.getHours();
            let greeting = '你好，准备好开始新的一天了吗？';
            let icon = 'wb_sunny';
            if (hour >= 5 && hour < 12) {
                greeting = '早上好，愿今天充满活力！';
                icon = 'wb_sunny';
            } else if (hour >= 12 && hour < 18) {
                greeting = '下午好，保持高效专注！';
                icon = 'wb_twilight';
            } else {
                greeting = '晚上好，享受悠闲时光！';
                icon = 'bedtime';
            }
            const greetingBadge = document.getElementById('greetingText');
            greetingBadge.textContent = greeting;
            greetingBadge.previousElementSibling.textContent = icon;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- Render Shortcuts ---
        function renderShortcuts() {
            const container = document.getElementById('shortcutsContainer');
            container.innerHTML = '';

            shortcuts.forEach((item, index) => {
                const card = document.createElement('a');
                card.className = 'shortcut-card';
                card.href = item.url;
                card.target = '_blank';

                const faviconUrl = `https://www.google.com/s2/favicons?domain=${new URL(item.url).hostname}&sz=64`;

                card.innerHTML = `
                    <button class="shortcut-delete-btn" data-index="${index}" title="删除">✕</button>
                    <div class="shortcut-icon-wrapper">
                        <img src="${faviconUrl}" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="shortcut-icon-fallback" style="display:none;">
                            <span class="material-symbols-rounded">${item.icon || 'public'}</span>
                        </div>
                    </div>
                    <div class="shortcut-title">${item.name}</div>
                `;

                container.appendChild(card);
            });

            // Add button card
            const addCard = document.createElement('div');
            addCard.className = 'shortcut-card add-shortcut-card';
            addCard.id = 'addShortcutCard';
            addCard.innerHTML = `
                <div class="shortcut-icon-wrapper">
                    <div class="shortcut-icon-fallback" style="background: transparent; color: var(--md-sys-color-primary);">
                        <span class="material-symbols-rounded" style="font-size: 32px;">add</span>
                    </div>
                </div>
                <div class="shortcut-title" style="color: var(--md-sys-color-primary);">添加快捷方式</div>
            `;
            addCard.addEventListener('click', () => openModal('shortcutModal'));
            container.appendChild(addCard);

            // Bind Delete Events
            document.querySelectorAll('.shortcut-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const idx = btn.getAttribute('data-index');
                    shortcuts.splice(idx, 1);
                    saveShortcuts();
                    renderShortcuts();
                });
            });
        }

        function saveShortcuts() {
            localStorage.setItem('startune_shortcuts', JSON.stringify(shortcuts));
        }

        renderShortcuts();

        // --- Add Shortcut Modal Handlers ---
        document.getElementById('saveShortcutBtn').addEventListener('click', () => {
            const name = document.getElementById('siteName').value.trim();
            let url = document.getElementById('siteUrl').value.trim();

            if (!name || !url) {
                alert('请填写名称和网址');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            shortcuts.push({ name, url, icon: 'public' });
            saveShortcuts();
            renderShortcuts();

            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            closeModal('shortcutModal');
        });

        document.getElementById('cancelShortcutBtn').addEventListener('click', () => {
            closeModal('shortcutModal');
        });

        // --- Search Engine Selector ---
        const engineSelector = document.getElementById('engineSelector');
        const engineMenu = document.getElementById('engineMenu');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');

        engineSelector.addEventListener('click', (e) => {
            e.stopPropagation();
            engineMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            engineMenu.classList.remove('active');
        });

        document.querySelectorAll('.engine-item').forEach(item => {
            item.addEventListener('click', () => {
                const action = item.getAttribute('data-action');
                const paramName = item.getAttribute('data-name');
                const engineName = item.innerText.trim();

                searchForm.action = action;
                searchInput.name = paramName;
                document.getElementById('engineName').textContent = engineName;
                engineMenu.classList.remove('active');
            });
        });

        // --- Theme & Color Accent Switcher ---
        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('startune_theme', theme);

            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.textContent = 'light_mode';
            } else {
                icon.textContent = 'dark_mode';
            }
        }

        function applyColor(color) {
            currentColor = color;
            document.documentElement.setAttribute('data-color', color);
            localStorage.setItem('startune_color', color);

            document.querySelectorAll('.color-dot').forEach(dot => {
                dot.classList.toggle('active', dot.getAttribute('data-color-val') === color);
            });
        }

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const nextTheme = (currentTheme === 'dark') ? 'light' : 'dark';
            applyTheme(nextTheme);
        });

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', () => {
                applyColor(dot.getAttribute('data-color-val'));
            });
        });

        // Settings Modal Handlers
        document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal'));
        document.getElementById('closeSettingsBtn').addEventListener('click', () => closeModal('settingsModal'));

        // Initialize theme & color
        applyTheme(currentTheme);
        applyColor(currentColor);

        // Modal Helpers
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('active');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('active');
        }

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
